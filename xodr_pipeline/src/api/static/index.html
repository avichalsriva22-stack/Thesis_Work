<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenDRIVE Pipeline Interface</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Draw CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        #overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            width: 320px;
            backdrop-filter: blur(10px);
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
        p { font-size: 0.9rem; color: #666; line-height: 1.4; }

        .loading-spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #status { text-align: center; font-weight: bold; margin-top: 10px; color: #3498db; }
        
        .download-btn {
            display: none;
            background: #2ecc71;
            color: white;
            padding: 10px 20px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        
        .download-btn:hover { background: #27ae60; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="overlay">
        <h2>OpenDRIVE Generator</h2>
        <p>1. Click the rectangle tool on the left.<br>2. Draw a bounding box over an intersection.</p>
        <div id="loading" class="loading-spinner"></div>
        <div id="status">Waiting for input...</div>
        <a id="downloadBtn" class="download-btn" download="result.xodr">Download .xodr</a>
    </div>

    <script>
        // Initialize Map
        var map = L.map('map').setView([40.7128, -74.0060], 15); // Default to NYC

        // Add CartoDB Positron Basemap for clean look
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // Feature Group to store drawn items
        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Configure Draw Control (Restrict to Rectangle only)
        var drawControl = new L.Control.Draw({
            draw: {
                polygon: false,
                marker: false,
                polyline: false,
                circle: false,
                circlemarker: false,
                rectangle: { shapeOptions: { color: '#3498db', weight: 2 } }
            },
            edit: { featureGroup: drawnItems }
        });
        map.addControl(drawControl);

        // Handle Draw Event
        map.on(L.Draw.Event.CREATED, function (event) {
            drawnItems.clearLayers(); // Only allow one box at a time
            var layer = event.layer;
            drawnItems.addLayer(layer);
            
            var bounds = layer.getBounds();
            var payload = {
                min_lat: bounds.getSouth(),
                max_lat: bounds.getNorth(),
                min_lon: bounds.getWest(),
                max_lon: bounds.getEast()
            };

            triggerPipeline(payload);
        });

        async function triggerPipeline(bbox) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('status').style.color = "#3498db";
            document.getElementById('status').innerText = "Processing pipeline...";

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bbox)
                });

                if (!response.ok) {
                    let errMsg = "Pipeline failed";
                    try {
                        const errJson = await response.json();
                        if (errJson && errJson.detail) {
                            if (typeof errJson.detail === 'object') {
                                errMsg = errJson.detail.message || JSON.stringify(errJson.detail);
                            } else {
                                errMsg = errJson.detail;
                            }
                        }
                    } catch (e) {
                        try {
                            errMsg = await response.text();
                        } catch (textErr) {}
                    }
                    throw new Error(errMsg);
                }

                const xodrData = await response.text();
                
                // Create a downloadable blob
                const blob = new Blob([xodrData], { type: 'application/xml' });
                const url = window.URL.createObjectURL(blob);
                
                const btn = document.getElementById('downloadBtn');
                btn.href = url;
                btn.style.display = 'block';
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').innerText = "Success! OpenDRIVE generated.";
                
            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').innerText = "Error: " + error.message;
                document.getElementById('status').style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
